              - upload ${ACC-CLOUD}/xyj-iaas/xyj-task/target/xyj-task-1.0-dev-SNAPSHOT.jar /root/app/xyj-task/xyj-task-1.0-dev-SNAPSHOT.jar
              - docker restart xyj-task

      - name: "发布测试【xyjacc】"
        workdir: "${XYJ-ACC}"
        description: ""
        commands:
          - name: "打包测试xyjacc"
            type: batch
            steps:
              - rm -rf ./libs/xyjacc-1.0.war
              - ./gradlew war

          - name: "发布测试xyjacc"
            type: "remote"
            machine: 196-dev
            steps:
              - docker stop xyjacc
              - rm -rf /root/app/xyjacc/webapps/xyjacc
              - rm -rf /root/app/xyjacc/webapps/xyjacc.war
              - upload ${XYJ-ACC}/build/libs/xyjacc-1.0.war /root/app/xyjacc/webapps/xyjacc.war
              - unzip /root/app/xyjacc/webapps/xyjacc.war -d /root/app/xyjacc/webapps/xyjacc
              - rm -rf /root/app/xyjacc/webapps/xyjacc.war
              - rm -rf /root/app/xyjacc/webapps/xyjacc/WEB-INF/classes/rebel.xml
              - /bin/cp -f /root/app/config.properties /root/app/xyjacc/webapps/xyjacc/WEB-INF/classes/config/config.properties
              - docker restart xyjacc

      - name: "发布测试【xyjacc-cron】"
        description: ""
        workdir: ${XYJ-ACC-CRON}
        commands:
          - name: "打包测试xyjacc-cron"
            type: batch
            steps:
              - rm -rf ./libs/xyjacc-1.0.war
              - ./gradlew war

          - name: "发布测试xyjacc-cron"
            type: "remote"
            machine: 196-dev
            steps:
              - docker stop xyjacc-corn
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc.war
              - upload ${XYJ-ACC-CRON}/build/libs/xyjacc-1.0.war /root/app/xyjacc-corn/webapps/xyjacc.war
              - unzip /root/app/xyjacc-corn/webapps/xyjacc.war -d /root/app/xyjacc-corn/webapps/xyjacc
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc.war
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc/WEB-INF/classes/rebel.xml
              - /bin/cp -f /root/app/config.properties /root/app/xyjacc-corn/webapps/xyjacc/WEB-INF/classes/config/config.properties
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc/WEB-INF/classes/xiyijiang/com/service/GetPromSmsReportService.class
              - rm -rf /root/app/xyjacc-corn/webapps/xyjacc/WEB-INF/classes/xiyijiang/com/service/GetSmsReportService.class
              - docker restart xyjacc-corn
      - name: "启动【测试环境】"
        description: ""
        commands:
          - name: "启动测试环境"
            type: "batch"
            steps:
              - curl https://t.xiyijiang.com/xyjacc/t/setServers?status=1
      - name: "发布测试【gateway&auth】"
        description: ""
        workdir: "${ACC-CLOUD}"
        commands:
          - name: "发布测试【gateway&auth】"
            type: "remote"
            machine: jz
            steps:
              - docker restart auth-service gateway
      - name: "启动【Nacos】"
        description: ""
        commands:
          - name: "启动Nacos"
            type: "batch"
            steps:
              - sh -c /Users/ll/Desktop/nacos/nacos/bin/startup.sh  -m standalone
      - name: "关闭【Nacos】"
        description: ""
        commands:
          - name: "关闭Nacos"
            type: "batch"
            steps:
              - ps aux | grep /Users/ll/Desktop/nacos/nacos | grep -v grep | awk '{print $2}' | xargs -r kill -9

      - name: "启动【Docker】"
        description: ""
        commands:
          - name: "启动Docker"
            type: "batch"
            steps:
              - open /Applications/Docker.app
      - name: "关闭【Docker】"
        description: ""
        commands:
          - name: "关闭Docker"
            type: "batch"
            steps:
              - ps aux | grep /Applications/Docker.app | grep -v grep | awk '{print $2}' | xargs -r kill -9
      - name: "获取【公网IP】"
        description: ""
        commands:
          - name: "获取公网IP"
            type: "batch"
            steps:
              - curl -s https://ipinfo.io/ip | tee /dev/tty | pbcopy
