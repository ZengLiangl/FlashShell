name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  APP_NAME: FlashDock
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: Windows-Amd64.exe
            kind: windows
          - os: windows-latest
            platform: windows/arm64
            asset: Windows-Arm64.exe
            kind: windows
          - os: macos-latest
            platform: darwin/arm64
            asset: MacOS-Arm64.dmg
            kind: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          npm ci --registry=https://registry.npmjs.org/
        working-directory: frontend
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Inject app version from tag
        shell: bash
        run: |
          RAW="${{ github.ref_name }}"
          if [[ "$RAW" == v* ]]; then
            VER="${RAW#v}"
          else
            VER="$RAW"
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          # 同步 wails.json productVersion（安装包元数据）
          python3 - <<'PY'
          import json, os
          ver = os.environ["APP_VERSION"]
          path = "wails.json"
          with open(path, encoding="utf-8") as f:
              cfg = json.load(f)
          cfg.setdefault("info", {})["productVersion"] = ver
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=4, ensure_ascii=False)
              f.write("\n")
          print(f"wails.json productVersion -> {ver}")
          PY

      - name: Build
        run: |
          wails build -clean -platform ${{ matrix.platform }} \
            -ldflags "-X FlashDock/app.Version=${APP_VERSION}"
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          # 可选：仓库 Settings → Secrets 配置 FLASHDOCK_GITHUB_TOKEN，用于嵌入更新检查
          # 运行时也可由环境变量 FLASHDOCK_GITHUB_TOKEN 提供
          FLASHDOCK_GITHUB_TOKEN: ${{ secrets.FLASHDOCK_GITHUB_TOKEN }}
        # 若需把 token 编进二进制（不推荐默认开启），可改用：
        # -ldflags "-X FlashDock/app.Version=${APP_VERSION} -X FlashDock/app.GitHubToken=${FLASHDOCK_GITHUB_TOKEN}"

      - name: Package Windows exe
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build/bin -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "未找到 Windows 可执行文件" }
          $outName = "FlashDock-${{ env.VERSION }}-${{ matrix.asset }}"
          Copy-Item $exe.FullName "dist/$outName" -Force
          Get-Item "dist/$outName"
          echo "RELEASE_ASSET=$outName" >> $env:GITHUB_ENV

      - name: Package macOS dmg
        if: matrix.kind == 'macos'
        run: |
          mkdir -p dist
          APP_PATH=$(find build/bin -maxdepth 2 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 包"
            ls -laR build/bin
            exit 1
          fi
          OUT_NAME="FlashDock-${{ env.VERSION }}-${{ matrix.asset }}"
          hdiutil create \
            -volname "FlashDock ${{ env.VERSION }}" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/${OUT_NAME}"
          ls -la "dist/${OUT_NAME}"
          echo "RELEASE_ASSET=${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ASSET }}
          path: dist/${{ env.RELEASE_ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p upload
          find release-assets -type f \( \
            -name 'FlashDock-*-Windows-*.exe' -o \
            -name 'FlashDock-*-MacOS-*.dmg' \
          \) -exec cp -v {} upload/ \;
          ls -la upload

      - name: Create Release and upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FlashDock ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
