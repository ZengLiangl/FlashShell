name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: Windows-Amd64.exe
            kind: windows
          - os: windows-latest
            platform: windows/arm64
            asset: Windows-Arm64.exe
            kind: windows
          - os: macos-13
            platform: darwin/amd64
            asset: MacOS-Amd64.dmg
            kind: macos
          - os: macos-latest
            platform: darwin/arm64
            asset: MacOS-Arm64.dmg
            kind: macos
          - os: ubuntu-latest
            platform: linux/amd64
            asset: Linux-Amd64.tar.gz
            kind: linux
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            asset: Linux-Arm64.tar.gz
            kind: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || \
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package Windows exe
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build/bin -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "未找到 Windows 可执行文件" }
          Copy-Item $exe.FullName "dist/${{ matrix.asset }}" -Force
          Get-Item "dist/${{ matrix.asset }}"

      - name: Package macOS dmg
        if: matrix.kind == 'macos'
        run: |
          mkdir -p dist
          APP_PATH=$(find build/bin -maxdepth 2 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 包"
            ls -laR build/bin
            exit 1
          fi
          hdiutil create \
            -volname "Quick Cmd" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/${{ matrix.asset }}"
          ls -la "dist/${{ matrix.asset }}"

      - name: Package Linux tar.gz
        if: matrix.kind == 'linux'
        run: |
          mkdir -p dist
          BIN_PATH=$(find build/bin -maxdepth 2 -type f -executable ! -name '*.so' | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "未找到 Linux 可执行文件"
            ls -laR build/bin
            exit 1
          fi
          BIN_NAME=$(basename "$BIN_PATH")
          tar -C "$(dirname "$BIN_PATH")" -czf "dist/${{ matrix.asset }}" "$BIN_NAME"
          ls -la "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p upload
          find release-assets -type f \( \
            -name 'Windows-*.exe' -o \
            -name 'MacOS-*.dmg' -o \
            -name 'Linux-*.tar.gz' \
          \) -exec cp -v {} upload/ \;
          ls -la upload

      - name: Create Release and upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            upload/Windows-Amd64.exe
            upload/Windows-Arm64.exe
            upload/MacOS-Amd64.dmg
            upload/MacOS-Arm64.dmg
            upload/Linux-Amd64.tar.gz
            upload/Linux-Arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
